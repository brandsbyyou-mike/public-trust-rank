# Weekly Editorial Update — the other half of the cadence split.
#
# Editorial/press mentions don't change day to day the way a rating or
# review count can -- a restaurant getting a news feature is a rare event,
# so checking it daily buys nothing a weekly check doesn't. Splitting it
# out onto its own schedule matters for two real reasons, not just
# tidiness: it keeps Google Custom Search usage inside the free 100/day
# allotment even at full-Scottsdale scale, and it keeps this factor's
# `updated_at` timestamp honest -- it should say "checked this week" (or,
# once the roster is large, "checked this rotation"), not imply a daily
# check that never added new information. Once the roster is bigger than
# Custom Search's free-tier budget, this run only checks a rotating slice
# of the roster each week instead of everyone -- see CSE_DAILY_BUDGET and
# the rotation comment in run.mjs.
#
# Runs services/agents/source-ingestion-agent/run.mjs in "weekly" mode,
# which fetches editorialMentions (rotated) plus place_id resolution and
# dish-mention review scanning, and carries every other factor forward
# untouched from whatever the daily job last found. Requires GOOGLE_CSE_KEY,
# GOOGLE_CSE_CX, and GOOGLE_PLACES_API_KEY as repo secrets (see
# docs/launch/go-live-cheap.md) -- runs fine with any of them unset, it just
# leaves the affected factor at its last known value with a logged reason.
# Every metered call here goes through the same budget guard as the daily
# job -- see the "Budget guard" comment in run.mjs.

name: Weekly Editorial Update

on:
  schedule:
    # 10:00 UTC every Sunday -- after Saturday's daily job, one day of
    # separation so the two jobs never race on the same output file.
    - cron: "0 10 * * 0"
  workflow_dispatch: {}

# Explicit write permission -- some GitHub accounts now default new
# repos' Actions token to read-only, which makes the final "git push"
# step below fail with exit code 128 (a generic git auth/permission
# error) even though everything else in the job succeeds. This line
# is the fix, confirmed against this repo's own first failed run.
permissions:
  contents: write

jobs:
  update-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source ingestion (weekly factors)
        env:
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }} # place_id resolution + dish-mention review scan -- see the DISH MENTIONS comment in run.mjs
        run: node services/agents/source-ingestion-agent/run.mjs weekly

      - name: Commit updated data
        run: |
          git config user.name "public-trust-rank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly editorial update $(date -u +%Y-%m-%d)"
          git push
