# Restaurant Discovery — manual-trigger ONLY, deliberately not on any
# schedule. This is a one-off (or occasional, when the roster needs
# refreshing) tool to find real Scottsdale restaurants via Google Places
# Nearby Search, not a recurring job -- see the comment at the top of
# services/agents/source-ingestion-agent/discover-restaurants.mjs for why
# this exists and why it writes a candidate list instead of auto-merging
# into the live snapshot.
#
# Run it from the Actions tab (Run workflow). It commits ONLY
# data/real-pilot/discovered-candidates.json and the shared API usage
# ledger -- it never touches scottsdale-real-snapshot.json or the live
# scores, so it can't affect what the app is currently showing.

name: Discover Restaurants

on:
  workflow_dispatch: {}

permissions:
  contents: write # some GitHub accounts default new repos' Actions token to read-only; the daily/weekly workflows hit this same wall (exit 128) before it was added there

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run restaurant discovery
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node services/agents/source-ingestion-agent/discover-restaurants.mjs

      - name: Commit discovered candidates
        run: |
          git config user.name "public-trust-rank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/real-pilot/discovered-candidates.json data/real-pilot/api-usage-ledger.json
          git diff --cached --quiet || git commit -m "Discover restaurant candidates $(date -u +%Y-%m-%d)"
          git push
